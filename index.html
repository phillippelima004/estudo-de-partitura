<!DOCTYPE html>
<html lang="pt-BR" class="transition-colors duration-300">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caderno de Estudo Musical - Viola, Violino & Violoncelo</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind config for Dark Mode -->
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- VexFlow 3.0.9 para renderização de partitura -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
  <!-- html2pdf.js para exportação de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
    }
    .staff-container { 
      width: 100%; 
      overflow-x: auto; 
      text-align: center; 
    }
    .pdf-hide { 
      display: block; 
    }
    .pdf-mode .pdf-hide { 
      display: none !important; 
    }
    .pdf-mode { 
      background-color: white !important; 
      padding: 20px; 
    }
    .pdf-mode * {
        color: black !important;
    }
    
    .staff-container svg {
      max-width: 100%;
      height: auto;
      overflow: visible !important;
      margin: 0 auto;
    }

    /* VexFlow Dark Mode adjustments */
    .dark .staff-container svg path, 
    .dark .staff-container svg text {
        fill: #e2e8f0;
        stroke: #e2e8f0;
    }
    .dark .staff-container svg .vf-stave path,
    .dark .staff-container svg .vf-stave line {
        fill: none;
        stroke: #94a3b8;
    }

    /* Estilo para destaque da nota durante o playback */
    .vf-notehead.playing-note path {
      fill: #4f46e5 !important;
      stroke: #4f46e5 !important;
      filter: drop-shadow(0px 0px 4px #818cf8);
    }
    .dark .vf-notehead.playing-note path {
      fill: #a5b4fc !important;
      stroke: #a5b4fc !important;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 bg-gray-100 dark:bg-slate-900 dark:text-gray-100 p-2 sm:p-6 flex flex-col items-center transition-colors duration-300">

    <div id="app-container" class="w-full max-w-6xl bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-4 sm:p-6 transition-colors duration-300 border dark:border-slate-700">
        
        <!-- Cabeçalho e Ações Principais -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b dark:border-slate-700 pb-4 pdf-hide gap-3">
            <div>
                <h1 class="text-2xl font-extrabold text-indigo-700 dark:text-indigo-400 tracking-tight" id="app-header-title">Estúdio de Música &amp; Partitura</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" id="app-header-subtitle">Clave de Dó (Viola), Sol (Violino) &amp; Fá (Violoncelo) • Caderno de Estudos</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto items-center justify-end">
                <input type="text" id="music-title-input" placeholder="Título da Partitura / Exercício..." class="border border-gray-300 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 flex-1 sm:w-60 dark:bg-slate-700 dark:text-white">
                
                <button onclick="toggleDarkMode()" class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-semibold py-1.5 px-3 rounded-lg transition-colors shadow-sm text-sm shrink-0">
                    <i class="fa-solid fa-moon" id="dark-mode-icon"></i>
                </button>

                <!-- Gestão de Projetos .estudo -->
                <button onclick="saveProject()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1.5 px-3 rounded-lg transition-colors shadow-sm text-sm shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Proj.
                </button>
                <label for="projectInput" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-1.5 px-3 rounded-lg transition-colors shadow-sm text-sm cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-folder-open"></i> Abrir Proj.
                </label>
                <input type="file" id="projectInput" accept=".estudo">

                <!-- Importador de MusicXML -->
                <label for="musicxmlInput" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-1.5 px-3 rounded-lg transition-colors shadow-sm text-sm cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-file-import"></i> MusicXML
                </label>
                <input type="file" id="musicxmlInput" accept=".xml,.musicxml">

                <button onclick="downloadWAV()" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-1.5 px-3 rounded-lg transition-colors shadow-sm text-sm shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-file-audio"></i> WAV
                </button>

                <button onclick="savePDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-1.5 px-3 rounded-lg transition-colors shadow-sm text-sm shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-file-pdf"></i> PDF
                </button>
            </div>
        </div>

        <!-- Título que aparece exclusivamente no PDF -->
        <h2 id="pdf-title" class="text-3xl font-bold text-center mb-6 hidden"></h2>

        <!-- Mensagens de Alerta / Validação -->
        <div id="message-box" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm text-center font-medium shadow-sm"></div>

        <!-- Painel de Áudio, Metrônomo e Playback -->
        <div class="pdf-hide bg-indigo-900 dark:bg-slate-900 text-white p-3.5 sm:p-4 rounded-xl mb-6 shadow-md border dark:border-slate-700">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <!-- Playback Áudio -->
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-300 mr-1">Reprodução:</span>
                    <button id="play-btn" onclick="togglePlay()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-3.5 py-1.5 rounded-lg font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                        <span id="play-icon">▶</span> <span id="play-text">Ouvir</span>
                    </button>
                    <button onclick="stopPlayback()" class="bg-indigo-800 hover:bg-indigo-700 text-indigo-200 px-3 py-1.5 rounded-lg font-bold text-xs sm:text-sm transition-all">
                        ■ Parar
                    </button>
                </div>

                <!-- Metrônomo Integrado -->
                <div class="flex items-center gap-3 bg-indigo-950/60 px-3 py-1.5 rounded-lg border border-indigo-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-300">Metrônomo:</span>
                    <button id="metro-btn" onclick="toggleMetronome()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs font-bold transition-all">
                        Ligar
                    </button>
                    <div class="flex items-center gap-2">
                        <input type="range" id="bpm-range" min="40" max="208" value="80" oninput="updateBPM(this.value)" class="w-20 sm:w-28 accent-emerald-400 cursor-pointer">
                        <span id="bpm-display" class="text-xs font-mono font-bold text-emerald-300 min-w-[55px]">80 BPM</span>
                    </div>
                    <div id="metro-pulse" class="w-3 h-3 rounded-full bg-indigo-800 border border-indigo-600 transition-colors"></div>
                </div>

                <!-- Andamento da Música -->
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold uppercase text-indigo-300">Andamento:</label>
                    <select id="tempo-select" onchange="renderStaff()" class="bg-indigo-800 dark:bg-slate-800 text-white text-xs rounded border border-indigo-700 px-2 py-1 focus:outline-none">
                        <option value="Moderato (♩ = 80)" selected>Moderato (♩ = 80)</option>
                        <option value="Allegro (♩ = 120)">Allegro (♩ = 120)</option>
                        <option value="Andante (♩ = 60)">Andante (♩ = 60)</option>
                        <option value="Adagio (♩ = 48)">Adagio (♩ = 48)</option>
                        <option value="Presto (♩ = 140)">Presto (♩ = 140)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Barra de Configurações de Pauta, Tonalidade e Afinação -->
        <div class="flex flex-wrap justify-center gap-3 mb-4 pdf-hide bg-gray-50 dark:bg-slate-700 p-3 sm:p-4 rounded-xl border border-gray-200 dark:border-slate-600 items-center">
            <div class="flex flex-col items-center">
                <label class="text-xs font-semibold text-gray-500 dark:text-gray-300 uppercase mb-1">Clave</label>
                <select id="clef-select" onchange="changeClef()" class="border border-gray-300 dark:border-slate-500 rounded-lg px-2 py-1 text-sm bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-indigo-900 dark:text-indigo-300">
                    <option value="alto" selected>C 3ª (Viola)</option>
                    <option value="treble">G (Violino)</option>
                    <option value="bass">F (Violoncelo)</option>
                </select>
            </div>
            
            <div class="flex flex-col items-center">
                <label class="text-xs font-semibold text-gray-500 dark:text-gray-300 uppercase mb-1">Armadura</label>
                <select id="key-select" onchange="renderStaff()" class="border border-gray-300 dark:border-slate-500 rounded-lg px-2 py-1 text-sm bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-gray-800 dark:text-gray-200">
                    <option value="C" selected>C (Dó M / Lá m)</option>
                    <option value="G">G (1♯)</option>
                    <option value="D">D (2♯)</option>
                    <option value="A">A (3♯)</option>
                    <option value="E">E (4♯)</option>
                    <option value="F">F (1♭)</option>
                    <option value="Bb">Bb (2♭)</option>
                    <option value="Eb">Eb (3♭)</option>
                </select>
            </div>

            <div class="flex flex-col items-center">
                <label class="text-xs font-semibold text-gray-500 dark:text-gray-300 uppercase mb-1">Fórmula</label>
                <select id="time-select" onchange="renderStaff()" class="border border-gray-300 dark:border-slate-500 rounded-lg px-2 py-1 text-sm bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-gray-200">
                    <option value="4/4" selected>4/4</option>
                    <option value="3/4">3/4</option>
                    <option value="2/4">2/4</option>
                    <option value="6/8">6/8</option>
                </select>
            </div>

            <div class="flex flex-col items-center">
                <label class="text-xs font-semibold text-gray-500 dark:text-gray-300 uppercase mb-1">Comp/Linha</label>
                <select id="measures-select" onchange="renderStaff()" class="border border-gray-300 dark:border-slate-500 rounded-lg px-2 py-1 text-sm bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-gray-200">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>

            <!-- Tom de Referência / Afinador Corda Solta -->
            <div class="flex flex-col items-center pl-2 border-l border-gray-300 dark:border-slate-500">
                <label class="text-xs font-semibold text-indigo-700 dark:text-indigo-400 uppercase mb-1"><i class="fa-solid fa-tuning-fork"></i> Afinação</label>
                <div id="tuner-buttons" class="flex gap-1"></div>
            </div>
        </div>

        <!-- Área da Partitura (Renderização VexFlow) -->
        <div class="w-full bg-white dark:bg-slate-800 rounded-xl shadow-inner border border-gray-200 dark:border-slate-700 p-2 sm:p-4 mb-4 staff-container min-h-[200px]" id="vf-container">
            <!-- Partitura renderizada aqui num ÚNICO SVG para permitir ligaduras globais -->
        </div>

        <!-- Guia do Espelho do Instrumento (Apoio Visual) -->
        <div class="pdf-hide mb-6 bg-slate-900 text-white p-3 rounded-xl border border-slate-700 shadow-inner">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold uppercase text-slate-300 tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-guitar"></i> Espelho do Instrumento 
                    <select id="position-select" onchange="forceFingerboardUpdate()" class="bg-slate-800 text-white text-xs px-1 py-0.5 rounded border border-slate-600 focus:outline-none">
                        <option value="1">1ª Posição</option>
                        <option value="3">3ª Posição</option>
                        <option value="5">5ª Posição</option>
                    </select>
                </span>
                <span id="fingerboard-info" class="text-xs text-indigo-300 font-semibold">Insira uma nota para ver a posição</span>
            </div>
            <div class="relative w-full h-20 bg-gradient-to-r from-[#3e2312] to-[#251105] rounded border-2 border-amber-950 overflow-hidden shadow-inner" id="fretboard">
                <!-- Pestana (Nut) -->
                <div class="absolute left-[8%] top-0 bottom-0 w-2 bg-gradient-to-b from-amber-100 to-amber-300 shadow"></div>
                
                <!-- Fitas / Marcações Didáticas -->
                <div class="absolute left-[20%] top-0 bottom-0 w-1 bg-white/20"></div>
                <div class="absolute left-[40%] top-0 bottom-0 w-1 bg-white/20"></div>
                <div class="absolute left-[60%] top-0 bottom-0 w-1 bg-white/20"></div>
                <div class="absolute left-[80%] top-0 bottom-0 w-1 bg-white/20"></div>

                <!-- Container das Cordas (Desenhadas via JS) -->
                <div id="fb-strings" class="w-full h-full absolute inset-0 pointer-events-none"></div>

                <!-- Indicador de Dedo -->
                <div id="finger-indicator" class="hidden absolute w-4 h-4 rounded-full bg-indigo-400 border-2 border-white shadow-[0_0_8px_rgba(129,140,248,0.8)] flex items-center justify-center text-[9px] font-bold text-white transition-all duration-300 transform -translate-x-1/2 -translate-y-1/2 z-10"></div>
            </div>
        </div>

        <!-- Painel de Ferramentas de Escrita -->
        <div class="pdf-hide space-y-3.5">
            
            <!-- Controle de Região / Oitava e Acorde -->
            <div class="flex flex-wrap items-center justify-center gap-2 bg-indigo-50 dark:bg-slate-700/50 p-2.5 rounded-xl border border-indigo-100 dark:border-slate-600">
                <span class="text-xs font-bold uppercase text-indigo-700 dark:text-indigo-300 tracking-wide mr-1">Região:</span>
                <button onclick="setOctave(2, this)" id="octave-2-btn" class="octave-btn px-3 py-1 bg-white dark:bg-slate-800 text-indigo-900 dark:text-indigo-200 border border-indigo-200 dark:border-slate-500 text-xs font-semibold rounded-lg shadow-sm transition-all">Oitava 2</button>
                <button onclick="setOctave(3, this)" id="octave-3-btn" class="octave-btn px-3 py-1 bg-white dark:bg-slate-800 text-indigo-900 dark:text-indigo-200 border border-indigo-200 dark:border-slate-500 text-xs font-semibold rounded-lg shadow-sm transition-all">Oitava 3</button>
                <button onclick="setOctave(4, this)" id="octave-4-btn" class="octave-btn px-3 py-1 bg-indigo-600 text-white border border-indigo-600 text-xs font-semibold rounded-lg shadow-sm transition-all">Oitava 4</button>
                <button onclick="setOctave(5, this)" id="octave-5-btn" class="octave-btn px-3 py-1 bg-white dark:bg-slate-800 text-indigo-900 dark:text-indigo-200 border border-indigo-200 dark:border-slate-500 text-xs font-semibold rounded-lg shadow-sm transition-all">Oitava 5</button>
                <button onclick="setOctave(6, this)" id="octave-6-btn" class="octave-btn px-3 py-1 bg-white dark:bg-slate-800 text-indigo-900 dark:text-indigo-200 border border-indigo-200 dark:border-slate-500 text-xs font-semibold rounded-lg shadow-sm transition-all">Oitava 6</button>

                <div class="w-px h-6 bg-indigo-200 dark:bg-slate-500 mx-2"></div>
                
                <button id="chord-mode-btn" onclick="toggleChordMode()" class="px-3 py-1 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-500 text-xs font-bold rounded-lg shadow-sm transition-all flex items-center gap-1">
                    <i class="fa-solid fa-layer-group"></i> Modo Acorde
                </button>
            </div>

            <!-- Durações e Texto-->
            <div class="flex flex-wrap justify-center items-center gap-1.5 sm:gap-2">
                <button onclick="setDuration('w', this)" class="dur-btn bg-gray-100 dark:bg-slate-700 text-gray-800 dark:text-gray-200 font-medium py-1 px-2.5 rounded-md text-xs sm:text-sm border border-transparent">Semibreve [1]</button>
                <button onclick="setDuration('h', this)" class="dur-btn bg-gray-100 dark:bg-slate-700 text-gray-800 dark:text-gray-200 font-medium py-1 px-2.5 rounded-md text-xs sm:text-sm border border-transparent">Mínima [2]</button>
                <button onclick="setDuration('q', this)" class="dur-btn bg-indigo-500 text-white font-medium py-1 px-2.5 rounded-md text-xs sm:text-sm shadow-md border border-transparent">Semínima [4]</button>
                <button onclick="setDuration('8', this)" class="dur-btn bg-gray-100 dark:bg-slate-700 text-gray-800 dark:text-gray-200 font-medium py-1 px-2.5 rounded-md text-xs sm:text-sm border border-transparent">Colcheia [8]</button>
                <button onclick="setDuration('16', this)" class="dur-btn bg-gray-100 dark:bg-slate-700 text-gray-800 dark:text-gray-200 font-medium py-1 px-2.5 rounded-md text-xs sm:text-sm border border-transparent">Semicolcheia</button>
                
                <div class="flex items-center ml-2 border dark:border-slate-600 rounded bg-white dark:bg-slate-800 overflow-hidden">
                    <span class="px-2 text-xs font-semibold text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-slate-700 py-1.5">Texto:</span>
                    <input type="text" id="annotation-input" placeholder="Ex: ponta, staccato..." class="text-xs px-2 py-1.5 w-32 focus:outline-none dark:bg-slate-800 dark:text-white">
                </div>
            </div>

            <!-- Modificadores Musicalmente Ricos -->
            <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2">
                <button id="sharp-btn" onclick="toggleAccidental('#')" class="text-xs sm:text-sm bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-300 font-medium py-1 px-2.5 rounded-full border border-red-200 dark:border-red-800">Sustenido (#)</button>
                <button id="flat-btn" onclick="toggleAccidental('b')" class="text-xs sm:text-sm bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-300 font-medium py-1 px-2.5 rounded-full border border-red-200 dark:border-red-800">Bemol (b)</button>
                <button id="natural-btn" onclick="toggleAccidental('n')" class="text-xs sm:text-sm bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-300 font-medium py-1 px-2.5 rounded-full border border-red-200 dark:border-red-800">Bequadro (♮)</button>
                
                <button id="bow-talao-btn" onclick="toggleBow('talao')" class="text-xs sm:text-sm bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 font-medium py-1 px-2.5 rounded-full border border-blue-200 dark:border-blue-800">Talão (⊓)</button>
                <button id="bow-ponta-btn" onclick="toggleBow('ponta')" class="text-xs sm:text-sm bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 font-medium py-1 px-2.5 rounded-full border border-blue-200 dark:border-blue-800">Ponta (∨)</button>
                
                <button id="dot-btn" onclick="toggleDot()" class="text-xs sm:text-sm bg-yellow-50 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-300 font-medium py-1 px-2.5 rounded-full border border-yellow-200 dark:border-yellow-800">Ponto (.)</button>
                <button id="staccato-btn" onclick="toggleStaccato()" class="text-xs sm:text-sm bg-pink-50 dark:bg-pink-900/30 text-pink-800 dark:text-pink-300 font-medium py-1 px-2.5 rounded-full border border-pink-200 dark:border-pink-800">Staccato</button>
                <!-- Multi-note Slur / Ligadura Button -->
                <button id="tie-btn" onclick="toggleTie()" class="text-xs sm:text-sm bg-teal-50 dark:bg-teal-900/30 text-teal-800 dark:text-teal-300 font-medium py-1 px-2.5 rounded-full border border-teal-200 dark:border-teal-800">Ligadura</button>
            </div>

            <!-- Dedilhados & Cordas do Instrumento -->
            <div class="flex flex-wrap justify-center items-center gap-1.5 sm:gap-2 bg-amber-50/70 dark:bg-amber-900/20 p-2 rounded-xl border border-amber-200/60 dark:border-amber-800/50">
                <span class="text-xs font-bold uppercase text-amber-800 dark:text-amber-500 mr-1">Dedilhado / Corda:</span>
                <button id="fing-0" onclick="toggleFingering('0')" class="fing-btn text-xs bg-white dark:bg-slate-800 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-700 font-bold px-2 py-0.5 rounded shadow-sm">0 (Solta)</button>
                <button id="fing-1" onclick="toggleFingering('1')" class="fing-btn text-xs bg-white dark:bg-slate-800 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-700 font-bold px-2 py-0.5 rounded shadow-sm">1º</button>
                <button id="fing-2" onclick="toggleFingering('2')" class="fing-btn text-xs bg-white dark:bg-slate-800 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-700 font-bold px-2 py-0.5 rounded shadow-sm">2º</button>
                <button id="fing-3" onclick="toggleFingering('3')" class="fing-btn text-xs bg-white dark:bg-slate-800 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-700 font-bold px-2 py-0.5 rounded shadow-sm">3º</button>
                <button id="fing-4" onclick="toggleFingering('4')" class="fing-btn text-xs bg-white dark:bg-slate-800 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-700 font-bold px-2 py-0.5 rounded shadow-sm">4º</button>

                <div class="h-4 w-[1px] bg-amber-300 dark:bg-amber-700 mx-1"></div>
                <div id="string-buttons-container" class="flex items-center gap-1.5"></div>
            </div>

            <!-- Dinâmicas Musicais -->
            <div class="flex flex-wrap justify-center items-center gap-1.5 bg-purple-50 dark:bg-purple-900/20 p-2 rounded-xl border border-purple-100 dark:border-purple-800/50">
                <span class="text-xs font-bold uppercase text-purple-800 dark:text-purple-400 mr-1">Dinâmica:</span>
                <button id="dyn-p" onclick="toggleDynamic('p')" class="dyn-btn text-xs italic font-serif bg-white dark:bg-slate-800 text-purple-900 dark:text-purple-300 border border-purple-200 dark:border-purple-800 px-2.5 py-0.5 rounded shadow-sm">p</button>

    <script>
        const VF = Vex.Flow;
        
        let notesArray = [];

        const noteNamesPt = { 'c': 'Dó', 'd': 'Ré', 'e': 'Mi', 'f': 'Fá', 'g': 'Sol', 'a': 'Lá', 'b': 'Si' };
        const noteBaseMidi = { 'c': 0, 'd': 2, 'e': 4, 'f': 5, 'g': 7, 'a': 9, 'b': 11 };

        const clefStringsInfo = {

                { name: 'C', midi: 48 }, { name: 'G', midi: 55 }, { name: 'D', midi: 62 }, { name: 'A', midi: 69 }

            ],

            ]

        const openStrings = {

            'treble': [ { name: 'G3', freq: 196.00 }, { name: 'D4', freq: 293.66 }, { name: 'A4', freq: 440.00 }, { name: 'E5', freq: 659.25 } ],
            'bass': [ { name: 'C2', freq: 65.41 }, { name: 'G2', freq: 98.00 }, { name: 'D3', freq: 146.83 }, { name: 'A3', freq: 220.00 } ]
        };

        const instrumentStrings = {
            'alto': [ { id: 'C', name: 'Corda C' }, { id: 'G', name: 'Corda G' }, { id: 'D', name: 'Corda D' }, { id: 'A', name: 'Corda A' } ],
            'treble': [ { id: 'G', name: 'Corda G' }, { id: 'D', name: 'Corda D' }, { id: 'A', name: 'Corda A' }, { id: 'E', name: 'Corda E' } ],
            'bass': [ { id: 'C', name: 'Corda C' }, { id: 'G', name: 'Corda G' }, { id: 'D', name: 'Corda D' }, { id: 'A', name: 'Corda A' } ]
        };

        const durationBeats = { 'w': 4, 'h': 2, 'q': 1, '8': 0.5, '16': 0.25, '32': 0.125, '64': 0.0625 };

        function getMidi(pitchObj) {
            let m = (pitchObj.octave + 1) * 12 + noteBaseMidi[pitchObj.key.toLowerCase()];
            if (pitchObj.accidental === '#') m += 1;
            if (pitchObj.accidental === 'b') m -= 1;
            return m;
        }

        function calculateExactFrequency(noteKey, octave, accidental) {
            let midi = (octave + 1) * 12 + noteBaseMidi[noteKey.toLowerCase()];
            if (accidental === '#') midi += 1;
            if (accidental === 'b') midi -= 1;
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                setupReverb();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function setupReverb() {
            const delay = audioCtx.createDelay();
            const feedback = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            delay.delayTime.value = 0.075; 
            feedback.gain.value = 0.25;    
            filter.type = 'lowpass';
            filter.frequency.value = 2200;

            delay.connect(feedback);
            feedback.connect(filter);
            filter.connect(delay);
            filter.connect(audioCtx.destination);

            reverbNode = delay;
        }

        function playBowedStringNote(freq, durationSeconds, dynamicStr, tieState = 'none') {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            let baseGain = 0.25;
            if (dynamicStr === 'p') baseGain = 0.12;
            else if (dynamicStr === 'mp') baseGain = 0.18;
            else if (dynamicStr === 'mf') baseGain = 0.28;
            else if (dynamicStr === 'f') baseGain = 0.38;
            else if (dynamicStr === 'ff') baseGain = 0.48;

            const oscSaw = ctx.createOscillator();
            oscSaw.type = 'sawtooth';
            oscSaw.frequency.setValueAtTime(freq, now);

            const oscTri = ctx.createOscillator();
            oscTri.type = 'triangle';
            oscTri.frequency.setValueAtTime(freq, now);

            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(5.5, now); 
            lfoGain.gain.setValueAtTime(0, now);
            lfoGain.gain.setTargetAtTime(freq * 0.008, now + 0.12, 0.08); 

            lfo.connect(oscSaw.frequency);
            lfo.connect(oscTri.frequency);

            const bodyFilter = ctx.createBiquadFilter();
            bodyFilter.type = 'lowpass';
            const startCutoff = Math.min(freq * 2.5, 1200);
            const peakCutoff = Math.min(freq * 6.5, 8000);
            bodyFilter.frequency.setValueAtTime(startCutoff, now);
            bodyFilter.frequency.exponentialRampToValueAtTime(peakCutoff, now + 0.08);
            bodyFilter.frequency.exponentialRampToValueAtTime(startCutoff * 1.5, now + durationSeconds);

            const masterGain = ctx.createGain();
            
            // Controle dinâmico do arco consoante a ligadura (Slur)
            let attackTime = 0.07;
            let releaseTime = 0.15;
            let gap = 0.04; // Pausa natural entre trocas de arco (détaché)

            if (tieState === 'start') {
                gap = 0.0; // Sem pausa, som une com o próximo
                releaseTime = 0.05;
            } else if (tieState === 'middle') {
                attackTime = 0.02; // Ataque imediato e contínuo
                gap = 0.0;
                releaseTime = 0.05;
            } else if (tieState === 'end') {
                attackTime = 0.02; // Ataque contínuo de quem já estava tocando
            }

            masterGain.gain.setValueAtTime(0.0001, now);
            masterGain.gain.linearRampToValueAtTime(baseGain, now + attackTime);
            masterGain.gain.setValueAtTime(baseGain, Math.max(now + attackTime, now + durationSeconds - gap));
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + durationSeconds + releaseTime);

            oscSaw.connect(bodyFilter);
            oscTri.connect(bodyFilter);
            bodyFilter.connect(masterGain);

            masterGain.connect(ctx.destination);
            if (reverbNode) masterGain.connect(reverbNode);

            lfo.start(now);
            oscSaw.start(now);
            oscTri.start(now);

            const stopTime = now + durationSeconds + releaseTime + 0.05;
            lfo.stop(stopTime);
            oscSaw.stop(stopTime);
            oscTri.stop(stopTime);
        }

        // --- Dark Mode ---
        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            if(isDarkMode) {
                document.documentElement.classList.add('dark');

        // --- Gestão de Projetos e Auto-Save ---
        function autoSave() {
            const cleanArray = notesArray.map(n => {
                const { vfNoteObj, ...cleanNote } = n;
                return cleanNote;
            });
            localStorage.setItem('estudo-project', JSON.stringify(cleanArray));
        }

        function loadAutoSave() {
            const saved = localStorage.getItem('estudo-project');
            if (saved) {
                try { 
                    notesArray = JSON.parse(saved);
                    migrateDataStructure(); 
                } catch(e) { notesArray = []; }
            }
        }

        function migrateDataStructure() {
            notesArray.forEach(n => {
                if (n.type === 'note' && !n.pitches) {
                    n.pitches = [{ key: n.key, octave: n.octave, accidental: n.accidental, stringInd: n.stringInd, fingering: n.fingering }];
                }
            });
        }

            const cleanArray = notesArray.map(n => {
                const { vfNoteObj, ...cleanNote } = n;
                return cleanNote;
            });
            const dataStr = JSON.stringify(cleanArray);
            const blob = new Blob([dataStr], {type: "application/json"});

            a.href = url;
            a.download = document.getElementById('music-title-input').value ? `${document.getElementById('music-title-input').value}.estudo` : 'Exercício.estudo';

            URL.revokeObjectURL(url);
        }

        function renderFingerboardStrings() {
            const container = document.getElementById('fb-strings');
            container.innerHTML = '';
            const strings = clefStringsInfo[currentClef] || clefStringsInfo['alto'];
            const yPositions = [20, 40, 60, 80];
            
            strings.forEach((s, idx) => {
                const thickness = 4 - idx;
                const strEl = document.createElement('div');
                strEl.className = 'absolute left-0 right-0 shadow-sm bg-gradient-to-b from-gray-300 to-gray-500 opacity-90';
                strEl.style.height = `${Math.max(1, thickness * 0.8)}px`;
                strEl.style.top = `${yPositions[idx]}%`;
                strEl.style.transform = 'translateY(-50%)';
                container.appendChild(strEl);
            });
        }

        function forceFingerboardUpdate() {
            const lastNote = notesArray.slice().reverse().find(n => n.type === 'note');
            updateFingerboardGuide(lastNote);
        }

        function updateFingerboardGuide(lastNote) {
            const indicator = document.getElementById('finger-indicator');
            const infoText = document.getElementById('fingerboard-info');

            if (!lastNote || lastNote.type !== 'note' || !lastNote.pitches || lastNote.pitches.length === 0) {
                indicator.classList.add('hidden');
                infoText.textContent = "Insira uma nota para ver a posição";
                return;
            }

            // Seleciona a nota mais aguda do acorde para guiar o dedilhado
            let highestPitch = lastNote.pitches.reduce((max, p) => getMidi(p) > getMidi(max) ? p : max, lastNote.pitches[0]);
            let noteMidi = getMidi(highestPitch);

            const strings = clefStringsInfo[currentClef] || clefStringsInfo['alto'];
            
            const positionOffsets = { '1': 0, '3': 4, '5': 7 };
            const posVal = document.getElementById('position-select').value;
            const posOffset = positionOffsets[posVal] || 0;

            let activeStringIndex = 0;
            for (let i = strings.length - 1; i >= 0; i--) {
                let minMidi = strings[i].midi + posOffset;
                if (noteMidi >= minMidi) {
                    activeStringIndex = i;
                    break;
                }
            }

            const openMidi = strings[activeStringIndex].midi;
            const stringName = strings[activeStringIndex].name;
            const semitoneDiff = noteMidi - openMidi;

            const semitonePositions = [4, 14, 20, 30, 40, 50, 60, 70, 80, 90, 95];
            let xPos = semitonePositions[Math.min(semitoneDiff, semitonePositions.length - 1)];
            
            const yPositions = [20, 40, 60, 80];
            let yPos = yPositions[activeStringIndex];

            // Calcula dedo teórico baseado na distância da nota e offset da posição
            let fingerMidi = semitoneDiff - posOffset;
            let fingerName = "0";
            if(fingerMidi < 0) fingerName = "?"; // nota impossível de tocar na posição
            else if(fingerMidi === 0) fingerName = "0";
            else if(fingerMidi === 1 || fingerMidi === 2) fingerName = "1";
            else if(fingerMidi === 3 || fingerMidi === 4) fingerName = "2";
            else if(fingerMidi === 5) fingerName = "3";
            else fingerName = "4";

            indicator.style.left = `${xPos}%`;
            indicator.style.top = `${yPos}%`;
            indicator.textContent = fingerMidi === 0 ? '0' : fingerName;
            indicator.classList.remove('hidden');

            const noteNameText = `${highestPitch.key.toUpperCase()}${highestPitch.accidental || ''}${highestPitch.octave}`;
            infoText.textContent = `Nota: ${noteNameText} | Corda: ${stringName} | Dedo: ${fingerMidi === 0 ? 'Solta' : fingerName + 'º'}`;
        }

        // Multi-note Tie Logic
        function toggleTie() {
            isTieActive = !isTieActive;
            if (isTieActive) {
                currentTieGroupId = Date.now();
            } else {
                pendingTieStop = true; // Next note typed will close the tie
            }
            updateButtons();
        }

        function updateButtons() {
            const accTypes = {'#': 'sharp-btn', 'b': 'flat-btn', 'n': 'natural-btn'};
            for(let key in accTypes) {
                let el = document.getElementById(accTypes[key]);
                if(currentAccidental === key) el.className = "text-xs sm:text-sm bg-red-200 dark:bg-red-800 text-red-900 dark:text-white font-medium py-1 px-2.5 rounded-full border border-red-400 shadow-inner";
                else el.className = "text-xs sm:text-sm bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-300 font-medium py-1 px-2.5 rounded-full border border-red-200 dark:border-red-800";
            }

            const bows = {'talao': 'bow-talao-btn', 'ponta': 'bow-ponta-btn'};
            for(let key in bows) {
                let el = document.getElementById(bows[key]);
                if(currentBow === key) el.className = "text-xs sm:text-sm bg-blue-200 dark:bg-blue-800 text-blue-900 dark:text-white font-medium py-1 px-2.5 rounded-full border border-blue-400 shadow-inner";
                else el.className = "text-xs sm:text-sm bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 font-medium py-1 px-2.5 rounded-full border border-blue-200 dark:border-blue-800";
            }

            document.getElementById("dot-btn").className = currentDot ? "text-xs sm:text-sm bg-yellow-200 dark:bg-yellow-800 text-yellow-900 dark:text-white font-medium py-1 px-2.5 rounded-full border border-yellow-400 shadow-inner" : "text-xs sm:text-sm bg-yellow-50 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-300 font-medium py-1 px-2.5 rounded-full border border-yellow-200 dark:border-yellow-800";
            document.getElementById("staccato-btn").className = currentStaccato ? "text-xs sm:text-sm bg-pink-200 dark:bg-pink-800 text-pink-900 dark:text-white font-medium py-1 px-2.5 rounded-full border border-pink-400 shadow-inner" : "text-xs sm:text-sm bg-pink-50 dark:bg-pink-900/30 text-pink-800 dark:text-pink-300 font-medium py-1 px-2.5 rounded-full border border-pink-200 dark:border-pink-800";
            document.getElementById("tie-btn").className = isTieActive ? "text-xs sm:text-sm bg-teal-200 dark:bg-teal-800 text-teal-900 dark:text-white font-medium py-1 px-2.5 rounded-full border border-teal-400 shadow-inner" : "text-xs sm:text-sm bg-teal-50 dark:bg-teal-900/30 text-teal-800 dark:text-teal-300 font-medium py-1 px-2.5 rounded-full border border-teal-200 dark:border-teal-800";
        }

        function checkFit(newDuration) {
            let currentMeasureBeats = 0;
            let maxBeats = getMaxBeats();
            
            for (let n of notesArray) {
                if (['repeat-start', 'repeat-end', 'volta-1', 'volta-2'].includes(n.type)) continue;
                let b = durationBeats[n.duration] * (n.dot ? 1.5 : 1);
                currentMeasureBeats += b;
                if (currentMeasureBeats >= maxBeats - 0.001) currentMeasureBeats = 0;
            }
            
            let addedB = durationBeats[newDuration] * (currentDot ? 1.5 : 1);
            if (currentMeasureBeats > 0 && (currentMeasureBeats + addedB) > maxBeats + 0.001) {
                showMessage(`Nota excederá a capacidade do compasso! Restam ${(maxBeats - currentMeasureBeats).toFixed(2)} tempos.`);
                return false;
            }
            return true;
        }

        function addNote(noteName) {
            if (!isChordMode && !checkFit(currentDuration)) return;
            
            let pitch = {
                key: noteName,
                octave: currentOctave,
                accidental: currentAccidental,
                fingering: currentFingering,
                stringInd: currentStringInd
            };

            let annotationVal = document.getElementById('annotation-input').value;
            if(annotationVal.trim() === '') annotationVal = null;

            // Handle multi-note ties
            let assignedTieGroup = null;
            if (isTieActive) {
                assignedTieGroup = currentTieGroupId;
            } else if (pendingTieStop) {
                assignedTieGroup = currentTieGroupId;
                pendingTieStop = false;
                currentTieGroupId = null; // Tie is complete
            }

            if (isChordMode && notesArray.length > 0 && notesArray[notesArray.length - 1].type === 'note') {
                notesArray[notesArray.length - 1].pitches.push(pitch);
                if (annotationVal) notesArray[notesArray.length - 1].annotation = annotationVal;
            } else {
                notesArray.push({
                    type: 'note',
                    pitches: [pitch],
                    duration: currentDuration,
                    bow: currentBow,
                    dot: currentDot,
                    staccato: currentStaccato,
                    tieGroup: assignedTieGroup,
                    dynamic: currentDynamic,
                    annotation: annotationVal
                });
            }
            
            document.getElementById('annotation-input').value = '';

            if (currentAccidental) toggleAccidental(currentAccidental);
            if (currentBow) toggleBow(currentBow); 
            if (currentDot) toggleDot();
            if (currentStaccato) toggleStaccato();
            if (currentFingering) toggleFingering(currentFingering);
            if (currentStringInd) toggleStringInd(currentStringInd);
            if (currentDynamic) toggleDynamic(currentDynamic);

            autoSave();
            updateFingerboardGuide(notesArray[notesArray.length - 1]);
            renderStaff();
        }

        function addRest() {
            if (!checkFit(currentDuration)) return;
            notesArray.push({ type: 'rest', duration: currentDuration, dot: currentDot });
            if (currentDot) toggleDot();
            autoSave();
            renderStaff();
        }

        function addRepeatStart() { notesArray.push({ type: 'repeat-start' }); autoSave(); renderStaff(); }
        function addRepeatEnd() { notesArray.push({ type: 'repeat-end' }); autoSave(); renderStaff(); }
        function addVolta(number) { notesArray.push({ type: number === 1 ? 'volta-1' : 'volta-2' }); autoSave(); renderStaff(); }

        function undo() {
            notesArray.pop();
            const lastNote = notesArray.slice().reverse().find(n => n.type === 'note');
            autoSave();
            updateFingerboardGuide(lastNote);
            renderStaff();
        }

        function clearStaff() {
            notesArray = [];
            stopPlayback();
            autoSave();
            updateFingerboardGuide(null);
            renderStaff();
        }

        function changeClef() {
            currentClef = document.getElementById("clef-select").value;
            if (currentClef === 'treble') setOctave(4, document.getElementById('octave-4-btn'));
            else if (currentClef === 'alto') setOctave(4, document.getElementById('octave-4-btn'));
            else if (currentClef === 'bass') setOctave(3, document.getElementById('octave-3-btn'));

            updateTunerUI();
            updateStringButtons();
            renderFingerboardStrings();
            renderStaff();
            
            const lastNote = notesArray.slice().reverse().find(n => n.type === 'note');
            if(lastNote) updateFingerboardGuide(lastNote);
        }

        // --- Metrônomo ---
        function updateBPM(val) {
            bpm = parseInt(val);
            document.getElementById('bpm-display').textContent = `${bpm} BPM`;
            if (isMetronomeOn) { stopMetronome(); startMetronome(); }
        }

        function toggleMetronome() {
            if (isMetronomeOn) stopMetronome();
            else startMetronome();
        }

        function startMetronome() {
            isMetronomeOn = true;
            document.getElementById('metro-btn').textContent = "Desligar";
            document.getElementById('metro-btn').className = "bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded text-xs font-bold transition-all";
            const intervalMs = (60 / bpm) * 1000;
            playClick();
            metronomeInterval = setInterval(playClick, intervalMs);
        }

        function stopMetronome() {
            isMetronomeOn = false;
            clearInterval(metronomeInterval);
            document.getElementById('metro-btn').textContent = "Ligar";
            document.getElementById('metro-btn').className = "bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs font-bold transition-all";
        }

        function playClick() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);

            const pulseEl = document.getElementById('metro-pulse');
            pulseEl.classList.remove('bg-indigo-800');
            pulseEl.classList.add('bg-emerald-400');
            setTimeout(() => {
                pulseEl.classList.remove('bg-emerald-400');
                pulseEl.classList.add('bg-indigo-800');
            }, 100);
        }

        // --- Playback ---
        function togglePlay() {
            if (isPlaying) stopPlayback();
            else startPlayback();
        }

        function startPlayback() {
            const executableNotes = notesArray.filter(n => n.type === 'note' || n.type === 'rest');
            if (executableNotes.length === 0) {
                showMessage("Escreva algumas notas antes de tocar!");
                return;
            }

            isPlaying = true;
            document.getElementById('play-icon').textContent = "❚❚";
            document.getElementById('play-text').textContent = "Pausar";
            document.getElementById('play-btn').className = "bg-amber-500 hover:bg-amber-400 text-white px-3.5 py-1.5 rounded-lg font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm";

            let noteIndex = 0;

            function playNextNote() {
                if (!isPlaying || noteIndex >= executableNotes.length) {
                    stopPlayback();
                    return;
                }

                const item = executableNotes[noteIndex];
                const beats = durationBeats[item.duration] * (item.dot ? 1.5 : 1);
                const durationSeconds = (beats * (60 / bpm));
                const durationMs = durationSeconds * 1000;

                // Análise inteligente da frase (para saber se o arco para ou continua)
                let prevItem = noteIndex > 0 ? executableNotes[noteIndex-1] : null;
                let nextItem = noteIndex < executableNotes.length - 1 ? executableNotes[noteIndex+1] : null;
                let tieState = 'none';
                
                if (item.tieGroup) {
                    let hasPrev = prevItem && prevItem.tieGroup === item.tieGroup;
                    let hasNext = nextItem && nextItem.tieGroup === item.tieGroup;
                    if (!hasPrev && hasNext) tieState = 'start';
                    else if (hasPrev && hasNext) tieState = 'middle';
                    else if (hasPrev && !hasNext) tieState = 'end';
                }

                if (item.type === 'note') {
                    item.pitches.forEach(p => {
                        const freq = calculateExactFrequency(p.key, p.octave, p.accidental);
                        playBowedStringNote(freq, durationSeconds, item.dynamic, tieState);
                    });
                    updateFingerboardGuide(item);
                }

                if (item.vfNoteObj && item.vfNoteObj.getSVGElement) {
                    const el = item.vfNoteObj.getSVGElement();
                    if (el) el.classList.add('playing-note');
                    setTimeout(() => { if (el) el.classList.remove('playing-note'); }, durationMs);
                }

                noteIndex++;
                playbackTimeout = setTimeout(playNextNote, durationMs);
            }

            playNextNote();
        }

        function stopPlayback() {
            isPlaying = false;
            clearTimeout(playbackTimeout);
            document.getElementById('play-icon').textContent = "▶";
            document.getElementById('play-text').textContent = "Ouvir";
            document.getElementById('play-btn').className = "bg-indigo-500 hover:bg-indigo-400 text-white px-3.5 py-1.5 rounded-lg font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm";
            document.querySelectorAll('.playing-note').forEach(e => e.classList.remove('playing-note'));
        }

        // --- Exportação WAV ---
        function downloadWAV() {
            const executableNotes = notesArray.filter(n => n.type === 'note' || n.type === 'rest');
            if (executableNotes.length === 0) {
                showMessage("A partitura está vazia para baixar áudio!");
                return;
            }

            let totalDuration = 0;
            executableNotes.forEach(item => {
                const beats = durationBeats[item.duration] * (item.dot ? 1.5 : 1);
                totalDuration += (beats * (60 / bpm));
            });

            const sampleRate = 44100;
            const offlineCtx = new OfflineAudioContext(1, sampleRate * (totalDuration + 0.5), sampleRate);
            let currentTime = 0;

            executableNotes.forEach((item, index) => {
                const beats = durationBeats[item.duration] * (item.dot ? 1.5 : 1);
                const durationSeconds = (beats * (60 / bpm));

                // Análise da frase para renderização do WAV idêntico ao reproduzido
                let prevItem = index > 0 ? executableNotes[index-1] : null;
                let nextItem = index < executableNotes.length - 1 ? executableNotes[index+1] : null;
                let tieState = 'none';
                
                if (item.tieGroup) {
                    let hasPrev = prevItem && prevItem.tieGroup === item.tieGroup;
                    let hasNext = nextItem && nextItem.tieGroup === item.tieGroup;
                    if (!hasPrev && hasNext) tieState = 'start';
                    else if (hasPrev && hasNext) tieState = 'middle';
                    else if (hasPrev && !hasNext) tieState = 'end';
                }

                if (item.type === 'note') {
                    item.pitches.forEach(p => {
                        const freq = calculateExactFrequency(p.key, p.octave, p.accidental);
                        const osc = offlineCtx.createOscillator();
                        const gain = offlineCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, currentTime);
                        
                        let attackTime = 0.07;
                        let releaseTime = 0.15;
                        let gap = 0.04;

                        if (tieState === 'start') { gap = 0.0; releaseTime = 0.05; }
                        else if (tieState === 'middle') { attackTime = 0.02; gap = 0.0; releaseTime = 0.05; }
                        else if (tieState === 'end') { attackTime = 0.02; }

                        gain.gain.setValueAtTime(0.001, currentTime);
                        gain.gain.linearRampToValueAtTime(0.2, currentTime + attackTime);
                        gain.gain.setValueAtTime(0.2, Math.max(currentTime + attackTime, currentTime + durationSeconds - gap));
                        gain.gain.exponentialRampToValueAtTime(0.001, currentTime + durationSeconds + releaseTime);
                        
                        osc.connect(gain);
                        gain.connect(offlineCtx.destination);
                        osc.start(currentTime);
                        osc.stop(currentTime + durationSeconds + releaseTime);
                    });
                }
                currentTime += durationSeconds;
            });

            offlineCtx.startRendering().then(renderedBuffer => {
                const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = document.getElementById('music-title-input').value ? `${document.getElementById('music-title-input').value}.wav` : 'Partitura_Estudo.wav';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            });
        }

        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels, length = len * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length), view = new DataView(buffer),
                channels = [], i, sample, offset = 0, pos = 0;
            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
            for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        // --- PDF & Render ---
        function savePDF() {
            stopPlayback();
            window.scrollTo(0, 0);
            const container = document.getElementById('app-container');
            const musicTitle = document.getElementById('music-title-input').value;
            const pdfTitleEl = document.getElementById('pdf-title');

            else { pdfTitleEl.classList.add('hidden'); }

            const vfContainer = document.getElementById('vf-container');

            const opt = {
                margin:       10,
                filename:     musicTitle ? `${musicTitle.replace(/\s+/g, '_')}.pdf` : 'Partitura_Estudo.pdf',
                image:        { type: 'jpeg', quality: 1 },

        function renderStaff() {
            const container = document.getElementById("vf-container");
            container.innerHTML = "";
            
            const timeSig = document.getElementById("time-select").value;
            const keySig = document.getElementById("key-select").value;
            const measuresPerLine = parseInt(document.getElementById("measures-select").value);
            const tempoText = document.getElementById("tempo-select").value;
            const maxBeats = getMaxBeats();
            
            const availableWidth = container.clientWidth > 100 ? container.clientWidth - 20 : 850;
            const baseMeasureWidth = Math.max(160, Math.floor((availableWidth - 80) / measuresPerLine));

            let measures = [];
            let currentMeasure = { notes: [], repeatStart: false, repeatEnd: false, volta: null };
            let currentBeats = 0;

            for (let n of notesArray) {
                if (n.type === 'repeat-start') { currentMeasure.repeatStart = true; continue; }
                if (n.type === 'repeat-end') { currentMeasure.repeatEnd = true; continue; }
                if (n.type === 'volta-1') { currentMeasure.volta = 1; continue; }
                if (n.type === 'volta-2') { currentMeasure.volta = 2; continue; }

                currentMeasure.notes.push(n);
                currentBeats += durationBeats[n.duration] * (n.dot ? 1.5 : 1);
                
                if (currentBeats >= maxBeats - 0.001) {
                    measures.push(currentMeasure);
                    currentMeasure = { notes: [], repeatStart: false, repeatEnd: false, volta: null };
                    currentBeats = 0;
                }
            }
            if (currentMeasure.notes.length > 0 || currentMeasure.repeatStart || currentMeasure.repeatEnd || currentMeasure.volta) {
                measures.push(currentMeasure);
            }
            if (measures.length === 0) {
                measures.push({ notes: [], repeatStart: false, repeatEnd: false, volta: null });
            }

            let lines = [];
            for (let i = 0; i < measures.length; i += measuresPerLine) {
                lines.push(measures.slice(i, i + measuresPerLine));
            }

            // Um único SVG para permitir ties entre compassos perfeitamente
            const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
            renderer.resize(availableWidth, lines.length * 150 + 20);
            const context = renderer.getContext();
            
            if (isDarkMode) {
                context.setFillStyle('#e2e8f0');
                context.setStrokeStyle('#e2e8f0');
            } else {
                context.setFillStyle('#000000');
                context.setStrokeStyle('#000000');
            }

            let globalTies = {};
            let currentY = 10;

            lines.forEach((lineMeasures, lineIndex) => {
                let xPos = 10;

                for (let i = 0; i < lineMeasures.length; i++) {
                    const measureData = lineMeasures[i];
                    const isFirstMeasureOfLine = (i === 0);
                    let mWidth = baseMeasureWidth;
                    if (isFirstMeasureOfLine) mWidth += 90; 

                    const stave = new VF.Stave(xPos, currentY, mWidth);
                    
                    if (isFirstMeasureOfLine) {
                        stave.addClef(currentClef).addKeySignature(keySig).addTimeSignature(timeSig);
                        if (lineIndex === 0) {
                            stave.setTempo({ name: tempoText.split('(')[0].trim(), duration: 'q', bpm: parseInt(tempoText.match(/\d+/)[0]) }, -30);
                        }
                    }
                    if (measureData.repeatStart) stave.setBegBarType(VF.Barline.type.REPEAT_BEGIN);
                    if (measureData.repeatEnd) stave.setEndBarType(VF.Barline.type.REPEAT_END); 
                    else if (lineIndex === lines.length - 1 && i === lineMeasures.length - 1) stave.setEndBarType(VF.Barline.type.END);
                    
                    if (measureData.volta) stave.setVoltaType(measureData.volta === 1 ? VF.Volta.type.BEGIN : VF.Volta.type.BEGIN_END, `${measureData.volta}.`, -5);

                    stave.setContext(context).draw();

                    const measureNotes = measureData.notes;
                    if (measureNotes && measureNotes.length > 0) {
                        const vfNotes = measureNotes.map((n) => {
                            let vfDuration = n.duration;
                            if (n.dot) vfDuration += "d";

                            let note;
                            if (n.type === 'rest') {
                                note = new VF.StaveNote({ keys: ["b/4"], duration: vfDuration + "r", clef: currentClef });
                                if (n.dot) note.addDot(0);
                            } else {
                                // Ordena pitches por MIDI
                                n.pitches.sort((a,b) => getMidi(a) - getMidi(b));
                                const keys = n.pitches.map(p => p.accidental && p.accidental !== 'n' ? `${p.key}${p.accidental}/${p.octave}` : `${p.key}/${p.octave}`);
                                
                                note = new VF.StaveNote({ keys: keys, duration: vfDuration, clef: currentClef });
                                
                                n.pitches.forEach((p, idx) => {
                                    if (p.accidental) note.addAccidental(idx, new VF.Accidental(p.accidental));
                                    if (p.fingering) note.addModifier(idx, new VF.StringNumber(p.fingering).setPosition(3));
                                    if (p.stringInd) note.addModifier(idx, new VF.Annotation(p.stringInd).setFont('sans-serif', 9, 'bold').setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM));
                                });

                                if (n.dot) note.addDot(0);
                                if (n.staccato) note.addModifier(0, new VF.Articulation('a.').setPosition(3));
                                if (n.bow) note.addModifier(0, new VF.Articulation(n.bow === 'talao' ? 'am' : 'a|').setPosition(3));
                                if (n.dynamic) note.addModifier(0, new VF.Annotation(n.dynamic).setFont('serif', 12, 'italic bold').setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM));
                                if (n.annotation) note.addModifier(0, new VF.Annotation(n.annotation).setFont('sans-serif', 10).setVerticalJustification(VF.Annotation.VerticalJustify.TOP));
                            }
                            
                            n.vfNoteObj = note;

                            // Handle Multi-note Tie Tracking
                            if (n.type === 'note' && n.tieGroup) {
                                if (!globalTies[n.tieGroup]) globalTies[n.tieGroup] = { first: note, last: note };
                                else globalTies[n.tieGroup].last = note;
                            }
                            return note;
                        });

                        const voice = new VF.Voice({ num_beats: maxBeats, beat_value: 4 });
                        voice.setMode(VF.Voice.Mode.SOFT);
                        voice.addTickables(vfNotes);
                        new VF.Formatter().joinVoices([voice]).format([voice], mWidth - (isFirstMeasureOfLine ? 95 : 30));
                        
                        const beams = VF.Beam.generateBeams(vfNotes, { groups: timeSig === '6/8' ? [new VF.Fraction(3, 8)] : [new VF.Fraction(1, 4)], flat_beams: false });

                        voice.draw(context, stave);
                        beams.forEach(b => b.setContext(context).draw());
                    }
                    xPos += mWidth;
                }
                currentY += 150; // Move height down for next system
            });

            // Draw multi-note ties across the single global SVG context
            Object.values(globalTies).forEach(t => {
                if (t.first !== t.last) {
                    new VF.StaveTie({
                        first_note: t.first,
                        last_note: t.last,
                        first_indices: [0],
                        last_indices: [0]
                    }).setContext(context).draw();
                }
            });
        }

        window.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            const key = e.key.toLowerCase();
            if (['c', 'd', 'e', 'f', 'g', 'a', 'b'].includes(key)) addNote(key);
            else if (key === '1') setDuration('w');
            else if (key === '2') setDuration('h');
            else if (key === '4') setDuration('q');
            else if (key === '8') setDuration('8');
            else if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            else if (e.ctrlKey && key === 'z') { e.preventDefault(); undo(); }
        });

        // Inicialização
        loadAutoSave();
        updateTunerUI();
        updateStringButtons();
        renderFingerboardStrings();
        renderStaff();
        window.addEventListener('resize', () => renderStaff());
    </script>
</body>
</html>
